<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 180px;
      font-family: Arial, sans-serif;
      padding: 10px;
      margin: 0;
      text-align: center;
      background: #f4f4f4;
    }
    button {
      width: 100%;
      padding: 10px;
      font-size: 14px;
      font-weight: bold;
      color: white;
      background-color: #fe2c55; /* Màu thương hiệu TikTok */
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #e0244c;
    }
    button.running {
      background-color: #333;
    }
  </style>
</head>
<body>
  <button id="toggleBtn">Bắt đầu</button>
  <script src="popup.js"></script>
</body>
</html>
